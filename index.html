<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幾 A 幾 B 猜數字</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --err: #dc2626;
    --err-bg: #fee2e2;
    --info-bg: #eef2ff;
    --shadow: 0 10px 30px rgba(15, 23, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120;
      --card: #162033;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #26344d;
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --ok: #4ade80;
      --ok-bg: #12351f;
      --err: #f87171;
      --err-bg: #3b1818;
      --info-bg: #1c2545;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 24px;
  }
  header { text-align: center; margin-bottom: 18px; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; letter-spacing: .02em; }
  .sub { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    font-size: .95rem;
  }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .track {
    width: 44px; height: 26px;
    background: var(--border);
    border-radius: 999px;
    position: relative;
    transition: background .2s;
    flex: none;
  }
  .track::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .2s;
  }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .switch input:focus-visible + .track { outline: 3px solid var(--primary); outline-offset: 2px; }

  .debug-box {
    background: var(--info-bg);
    border: 1px dashed var(--primary);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: .95rem;
  }
  .debug-box[hidden] { display: none; }
  .debug-box strong {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.2rem;
    letter-spacing: .25em;
    margin-left: 6px;
  }

  form { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.5rem;
    letter-spacing: .3em;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text);
    transition: border-color .15s;
  }
  input[type="text"]:focus { outline: none; border-color: var(--primary); }
  input[type="text"]:disabled { opacity: .5; cursor: not-allowed; }
  input[type="text"]::placeholder { letter-spacing: .3em; color: var(--muted); opacity: .6; }

  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    cursor: pointer;
    transition: background .15s, transform .05s, opacity .15s;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-ghost {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
  }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

  .message {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: .95rem;
    line-height: 1.5;
    min-height: 1.5em;
  }
  .message:empty { display: none; }
  .message.error { background: var(--err-bg); color: var(--err); }
  .message.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .message.info { background: var(--info-bg); color: var(--text); }

  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 22px 0 8px;
    font-weight: 600;
  }
  .count { color: var(--muted); font-weight: 400; font-size: .9rem; }
  ol#history {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 340px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  ol#history:empty::before {
    content: "還沒有任何猜測，輸入四個不重複的數字開始吧！";
    display: block;
    padding: 18px;
    text-align: center;
    color: var(--muted);
    font-size: .9rem;
  }
  ol#history li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  ol#history li:last-child { border-bottom: none; }
  .idx { color: var(--muted); width: 2.2em; font-size: .85rem; }
  .guess {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.2rem;
    letter-spacing: .25em;
    flex: 1;
  }
  .badge {
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 999px;
    background: var(--info-bg);
    font-variant-numeric: tabular-nums;
  }
  li.win .badge { background: var(--ok-bg); color: var(--ok); }

  footer { margin-top: 18px; display: flex; justify-content: center; }

  @media (max-width: 380px) {
    .card { padding: 16px; }
    input[type="text"] { font-size: 1.25rem; }
    button { padding: 12px 14px; }
  }
</style>
</head>
<body>
<main>
  <section class="card">
    <header>
      <h1>🔢 幾 A 幾 B 猜數字</h1>
      <p class="sub">答案是 4 個不重複的數字（0–9，可以 0 開頭）。<br>A＝數字與位置都對；B＝數字對但位置不同。</p>
    </header>

    <div class="toolbar">
      <label class="switch">
        <input type="checkbox" id="debugToggle" role="switch">
        <span class="track" aria-hidden="true"></span>
        <span>🐞 除錯模式</span>
      </label>
      <button type="button" class="btn-ghost" id="restartBtn">🔄 重新開始</button>
    </div>

    <div class="debug-box" id="debugBox" hidden>
      目前答案：<strong id="debugAnswer"></strong>
    </div>

    <form id="guessForm" autocomplete="off" novalidate>
      <input type="text" id="guessInput" inputmode="numeric" placeholder="0123" aria-label="輸入四位不重複數字">
      <button type="submit" class="btn-primary" id="submitBtn">送出</button>
    </form>

    <div class="message" id="message" role="status" aria-live="polite"></div>

    <div class="history-head">
      <span>猜測紀錄</span>
      <span class="count" id="count">共 0 次</span>
    </div>
    <ol id="history"></ol>
  </section>
</main>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const form = $('guessForm');
  const input = $('guessInput');
  const submitBtn = $('submitBtn');
  const restartBtn = $('restartBtn');
  const debugToggle = $('debugToggle');
  const debugBox = $('debugBox');
  const debugAnswer = $('debugAnswer');
  const message = $('message');
  const historyEl = $('history');
  const countEl = $('count');

  // 遊戲狀態（答案一律使用字串，保留開頭的 0）
  let answer = '';
  let guesses = [];
  let finished = false;

  // 產生 4 個不重複數字（Fisher–Yates 洗牌）
  function generateAnswer() {
    const digits = '0123456789'.split('');
    for (let i = digits.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [digits[i], digits[j]] = [digits[j], digits[i]];
    }
    return digits.slice(0, 4).join('');
  }

  // 計算幾 A 幾 B
  function evaluate(guess, target) {
    let a = 0, b = 0;
    for (let i = 0; i < 4; i++) {
      if (guess[i] === target[i]) a++;
      else if (target.includes(guess[i])) b++;
    }
    return { a, b };
  }

  // 驗證輸入，回傳錯誤訊息；合法則回傳 null
  function validate(value) {
    if (value === '') return '請輸入四位數字，不能是空白。';
    if (!/^\d+$/.test(value)) return '只能輸入數字 0–9，請修正。';
    if (value.length !== 4) return `需要剛好 4 位數字（目前 ${value.length} 位），請修正。`;
    if (new Set(value).size !== 4) return '數字不可重複（例如 1123 無效），請修正。';
    return null;
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'message' + (type ? ' ' + type : '');
  }

  function renderDebug() {
    const on = debugToggle.checked;
    debugBox.hidden = !on;
    debugAnswer.textContent = on ? answer : '';
  }

  function renderHistory() {
    historyEl.innerHTML = '';
    // 最新的猜測顯示在最上方
    for (let i = guesses.length - 1; i >= 0; i--) {
      const g = guesses[i];
      const li = document.createElement('li');
      if (g.a === 4) li.className = 'win';

      const idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = '#' + (i + 1);

      const num = document.createElement('span');
      num.className = 'guess';
      num.textContent = g.value;

      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = `${g.a}A${g.b}B`;

      li.append(idx, num, badge);
      historyEl.appendChild(li);
    }
    countEl.textContent = `共 ${guesses.length} 次`;
  }

  function setInputEnabled(enabled) {
    input.disabled = !enabled;
    submitBtn.disabled = !enabled;
  }

  function startGame() {
    answer = generateAnswer();
    guesses = [];
    finished = false;
    debugToggle.checked = false; // 新局預設關閉除錯模式
    input.value = '';
    setInputEnabled(true);
    showMessage('新的一局開始了，祝你好運！', 'info');
    renderDebug();
    renderHistory();
    input.focus();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (finished) return;

    const value = input.value.trim();
    const error = validate(value);
    if (error) {
      // 無效輸入：只提示，不計次數、不改答案
      showMessage('⚠️ ' + error, 'error');
      input.focus();
      input.select();
      return;
    }

    const { a, b } = evaluate(value, answer);
    guesses.push({ value, a, b });
    renderHistory();
    input.value = '';

    if (a === 4) {
      finished = true;
      setInputEnabled(false);
      showMessage(`🎉 恭喜通關！答案是 ${answer}，共猜了 ${guesses.length} 次。按「重新開始」再玩一局。`, 'ok');
    } else {
      showMessage(`${value} → ${a}A${b}B`, 'info');
      input.focus();
    }
  });

  // 除錯模式：只切換顯示，不影響答案、紀錄與次數
  debugToggle.addEventListener('change', renderDebug);

  restartBtn.addEventListener('click', startGame);

  startGame();
})();
</script>
</body>
</html>
